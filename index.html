<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おみくじ</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
    background:linear-gradient(135deg,#f5ecd8,#fffaf0);
    color:#222;
    min-height:100vh;
}

button{
    font-family:inherit;
}

.screen{
    display:none;
    min-height:100vh;
}

.screen.active{
    display:block;
}

.home{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:45px 20px;
}

.logo{
    font-size:48px;
    font-weight:900;
    letter-spacing:8px;
}

.subtitle{
    color:#777;
    margin:8px 0 35px;
}

.omikuji-box{
    width:min(92%,560px);
    background:#fff;
    border-radius:28px;
    padding:35px 25px;
    box-shadow:0 15px 45px rgba(0,0,0,.12);
    text-align:center;
}

.omikuji-symbol{
    font-size:90px;
}

.draw-button{
    width:100%;
    padding:20px;
    border:0;
    border-radius:18px;
    background:#222;
    color:#fff;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
}

.draw-button:hover{
    transform:translateY(-2px);
}

.draw-button:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.home-buttons{
    width:min(92%,560px);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}

.menu-button{
    padding:17px 8px;
    border:0;
    border-radius:16px;
    background:#fff;
    box-shadow:0 7px 22px rgba(0,0,0,.1);
    cursor:pointer;
    font-weight:bold;
}

.test-buttons{
    width:min(92%,560px);
    margin-top:18px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}

.test-button{
    padding:13px 5px;
    border:0;
    border-radius:14px;
    background:#eee;
    cursor:pointer;
    font-weight:bold;
}

.coin-display{
    margin-top:20px;
    background:#fff;
    padding:10px 20px;
    border-radius:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.result{
    display:none;
    margin-top:25px;
}

.result-card{
    background:#fffaf0;
    border:2px solid #e2cf99;
    border-radius:20px;
    padding:25px;
}

.result-name{
    font-size:35px;
    font-weight:900;
}

.result-text{
    margin-top:12px;
    line-height:1.8;
}

.back{
    position:fixed;
    top:18px;
    left:18px;
    z-index:1000;
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.78);
    color:#fff;
    font-size:24px;
    cursor:pointer;
}

.page-title{
    text-align:center;
    font-size:32px;
    font-weight:900;
    margin-bottom:25px;
}

.collection-grid{
    width:min(95%,800px);
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
    gap:10px;
}

.collection-item{
    min-height:85px;
    border:0;
    border-radius:16px;
    padding:10px;
    font-weight:bold;
    cursor:pointer;
}

.collection-item.obtained{
    background:#fff0b7;
}

.collection-item.locked{
    background:#ddd;
    color:#888;
    cursor:not-allowed;
}

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-overlay.active{
    display:flex;
}

.modal{
    width:min(94%,600px);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:25px;
    padding:25px;
    text-align:center;
}

.modal-title{
    font-size:30px;
    font-weight:900;
}

.modal-text{
    margin:20px 0;
    line-height:1.8;
}

.action-button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:13px;
    margin-top:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
}

.primary{
    background:#222;
    color:#fff;
}

.secondary{
    background:#eee;
}

.mission{
    width:min(95%,650px);
    background:#fff;
    border-radius:18px;
    padding:20px;
    margin-bottom:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.mission h3{
    margin-top:0;
}

.progress{
    height:10px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin:12px 0;
}

.progress-bar{
    height:100%;
    background:#222;
}

.reward-button{
    padding:11px 17px;
    border:0;
    border-radius:10px;
    background:#222;
    color:#fff;
    cursor:pointer;
}

.reward-button:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.shop-box{
    width:min(92%,560px);
    min-height:300px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border-radius:25px;
    box-shadow:0 12px 35px rgba(0,0,0,.1);
    font-size:34px;
    font-weight:900;
}

/* ======================
   演出
====================== */

#effect{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
}

.effect-rays{
    position:absolute;
    width:180vmax;
    height:180vmax;
    background:
    repeating-conic-gradient(
        transparent 0deg 7deg,
        rgba(255,220,100,.22) 8deg 11deg,
        transparent 12deg 20deg
    );
    animation:rotate 12s linear infinite;
}

.effect-light{
    position:absolute;
    width:15vmin;
    height:15vmin;
    border-radius:50%;
    background:#fff;
    box-shadow:
        0 0 40px #fff,
        0 0 100px gold,
        0 0 220px gold;
    animation:pulse 3s infinite;
}

.effect-text{
    position:relative;
    z-index:5;
    color:#fff;
    font-size:65px;
    font-weight:900;
    text-shadow:
        0 0 20px gold,
        0 0 50px #fff;
    opacity:0;
}

.effect-text.show{
    animation:appear 1.2s forwards;
}

.skip{
    position:absolute;
    top:20px;
    right:20px;
    z-index:20;
    padding:12px 18px;
    border:1px solid rgba(255,255,255,.5);
    border-radius:12px;
    background:rgba(0,0,0,.65);
    color:#fff;
    cursor:pointer;
}

/* ======================
   YouTube演出
====================== */

#videoContainer{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
}

#youtubeFrame{
    width:min(90vw,900px);
    aspect-ratio:16/9;
    border:0;
}

.video-note{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:13px;
    opacity:.7;
}

@keyframes rotate{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes pulse{
    0%,100%{
        transform:scale(.4);
        opacity:.25;
    }
    50%{
        transform:scale(2);
        opacity:1;
    }
}

@keyframes appear{
    from{
        transform:scale(.2);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

@media(max-width:600px){

    .logo{
        font-size:38px;
    }

    .home-buttons{
        grid-template-columns:1fr;
    }

    .test-buttons{
        grid-template-columns:1fr;
    }

    .effect-text{
        font-size:42px;
    }
}
</style>
</head>

/* =====================================================
   保存データ
===================================================== */

let data =
JSON.parse(
localStorage.getItem("omikujiData") || "{}"
);

if(typeof data.coins !== "number")
data.coins=0;

if(!Array.isArray(data.obtained))
data.obtained=[];

if(typeof data.drawCount !== "number")
data.drawCount=0;

if(typeof data.lastDraw !== "string")
data.lastDraw="";

if(!data.missions)
data.missions={};

if(!data.claimed)
data.claimed={};

let selectedResult=null;

let effectTimer=null;


/* =====================================================
   保存
===================================================== */

function save(){

localStorage.setItem(
"omikujiData",
JSON.stringify(data)
);

}


/* =====================================================
   日付
===================================================== */

function today(){

const d=new Date();

return d.getFullYear()
+"-"
+String(d.getMonth()+1).padStart(2,"0")
+"-"
+String(d.getDate()).padStart(2,"0");

}


/* =====================================================
   画面
===================================================== */

function openPage(page){

document
.querySelectorAll(".screen")
.forEach(x=>{
x.classList.remove("active");
});

document
.getElementById(page+"Screen")
.classList.add("active");

if(page==="collection")
renderCollection();

if(page==="missions")
renderMissions();

}

function goHome(){

document
.querySelectorAll(".screen")
.forEach(x=>{
x.classList.remove("active");
});

document
.getElementById("homeScreen")
.classList.add("active");

}


/* =====================================================
   コイン
===================================================== */

function updateCoins(){

document
.getElementById("coinCount")
.textContent=data.coins;

}


/* =====================================================
   コイン報酬
===================================================== */

function coinReward(result){

if(result.name==="超特大吉")
return 100;

if(result.name==="大吉")
return 50;

if(result.type==="unique")
return 10;

if([
"末小吉",
"凶",
"小凶",
"半凶",
"末凶",
"大凶"
].includes(result.name))
return 1;

return 5;

}


/* =====================================================
   本番おみくじ
===================================================== */

function drawRealOmikuji(){

if(data.lastDraw===today()){

alert(
"今日はもう引きました！\nまた明日引けます。"
);

return;

}

const result=
omikuji[
Math.floor(
Math.random()*omikuji.length
)
];

data.lastDraw=today();

data.drawCount++;

registerResult(result);

data.coins+=coinReward(result);

updateMissions(result);

save();

updateCoins();

playResult(result);

updateDrawButton();

}


/* =====================================================
   結果登録
===================================================== */

function registerResult(result){

if(!data.obtained.includes(result.name)){

data.obtained.push(result.name);

}

}


/* =====================================================
   ミッション更新
===================================================== */

function updateMissions(result){

data.missions.once=true;

if(data.drawCount>=10)
data.missions.ten=true;

if(data.drawCount>=30)
data.missions.thirty=true;

if(result.type==="unique")
data.missions.unique=true;

if(result.name==="超特大吉")
data.missions.super=true;

if(data.obtained.length>=omikuji.length)
data.missions.complete=true;

}


/* =====================================================
   テスト
===================================================== */

function testRandom(){

const result=
omikuji[
Math.floor(
Math.random()*omikuji.length
)
];

playResult(result);

}

function testGreat(){

const result=
omikuji.find(
x=>x.name==="大吉"
);

playResult(result);

}

function testSuper(){

const result=
omikuji.find(
x=>x.name==="超特大吉"
);

playResult(result);

}


/* =====================================================
   結果表示
===================================================== */

document
.getElementById("result")
.style.display="block";

document
.getElementById("resultName")
.textContent=result.name;

document
.getElementById("resultText")
.textContent=result.text;

}


/* =====================================================
   結果演出
===================================================== */

function playResult(result){

if(result.type==="great" ||
result.type==="super"){

playLuxuryEffect(result);

return;

}

if(result.video &&
result.video.platform==="youtube"){

playYouTubeEffect(result);

return;

}

そのため通常の演出を表示。

showSimpleEffect(result);

}


/* =====================================================
   通常演出
===================================================== */

function showSimpleEffect(result){

const effect=
document.getElementById("effect");

const text=
document.getElementById("effectText");

const graphics=
document.getElementById("effectGraphics");

const video=
document.getElementById("videoContainer");

video.style.display="none";

graphics.style.display="block";

effect.style.display="flex";

effect.style.background="#111";

text.textContent=result.name;

text.classList.add("show");

effectTimer=setTimeout(()=>{

finishEffect();

showResult(result);

},2200);

}


/* =====================================================
   豪華演出
===================================================== */

function playLuxuryEffect(result){

const effect=
document.getElementById("effect");

const graphics=
document.getElementById("effectGraphics");

const video=
document.getElementById("videoContainer");

const text=
document.getElementById("effectText");

video.style.display="none";

graphics.style.display="block";

effect.style.display="flex";

effect.style.background="#000";

text.textContent="";

text.classList.remove("show");

/* 暗転 */

setTimeout(()=>{

effect.style.background=
"radial-gradient(circle,#fff,#e5b936,#080808)";

},1300);


/* 光 */

setTimeout(()=>{

text.textContent=result.name;

text.classList.add("show");

},3200);


/* 終了 */

effectTimer=setTimeout(()=>{

finishEffect();

showResult(result);

},6000);

}


/* =====================================================
   YouTube演出
===================================================== */

function playYouTubeEffect(result){

const effect=
document.getElementById("effect");

const video=
document.getElementById("videoContainer");

const graphics=
document.getElementById("effectGraphics");

const frame=
document.getElementById("youtubeFrame");

const text=
document.getElementById("effectText");

effect.style.display="flex";

effect.style.background="#000";

graphics.style.display="none";

text.classList.remove("show");

text.textContent="";


let url=
"https://www.youtube.com/embed/"
+
result.video.id
+
"?autoplay=1&rel=0&modestbranding=1";


if(typeof result.video.start==="number"){

url+="&start="+result.video.start;

}

frame.src=url;

video.style.display="flex";


let duration=10000;

if(
typeof result.video.start==="number" &&
typeof result.video.end==="number"
){

duration=
(result.video.end-result.video.start)*1000
+1500;

}

effectTimer=setTimeout(()=>{

finishEffect();

showResult(result);

},duration);

}


/* =====================================================
   演出スキップ
===================================================== */

function skipEffect(){

if(effectTimer){

clearTimeout(effectTimer);

effectTimer=null;

}

finishEffect();

if(selectedResult){

showResult(selectedResult);

selectedResult=null;

}

}


/* =====================================================
   演出終了
===================================================== */

function finishEffect(){

const effect=
document.getElementById("effect");

const frame=
document.getElementById("youtubeFrame");

const video=
document.getElementById("videoContainer");

const text=
document.getElementById("effectText");

effect.style.display="none";

video.style.display="none";

frame.src="";

text.textContent="";

text.classList.remove("show");

}

/* =====================================================
   ミッション生成
===================================================== */

function createMission(
parent,
id,
title,
complete,
reward,
coins,
special=""
){

let progress=0;
let max=1;

if(id==="once"){
progress=Math.min(data.drawCount,1);
max=1;
}

if(id==="ten"){
progress=Math.min(data.drawCount,10);
max=10;
}

if(id==="thirty"){
progress=Math.min(data.drawCount,30);
max=30;
}

if(id==="complete"){
progress=Math.min(
data.obtained.length,
omikuji.length
);
max=omikuji.length;
}

const percentage=
Math.round(
progress/max*100
);

const claimed=
data.claimed[id]===true;

const div=
document.createElement("div");

div.className="mission";

div.innerHTML=`

<h3>${title}</h3>

<div class="progress">
<div
class="progress-bar"
style="width:${percentage}%">
</div>
</div>

<div>
進行度：
${progress}/${max}
</div>

<p>
報酬：${reward}
</p>

<button
class="reward-button"
${(!complete || claimed)?"disabled":""}
onclick="claimMission('${id}','${special}',${coins})">

${
claimed
?"受け取り済み"
:complete
?"受け取る"
:"未達成"
}

</button>

`;

parent.appendChild(div);

}


/* =====================================================
   ミッション受取
===================================================== */

function claimMission(
id,
special,
coins
){

if(data.claimed[id])
return;

if(coins>0)
data.coins+=coins;


if(special==="unique"){

alert(
"ミッション達成！\n2000カウンシーを獲得しました！"
);

}

if(special==="super"){

alert(
"ミッション達成！\n5000カウンシーを獲得しました！"
);

}

if(special==="complete"){

alert(
"ミッション達成！\n\n称号「おみくじ別班」を獲得しました！"
);

}

data.claimed[id]=true;

save();

updateCoins();

renderMissions();

}
