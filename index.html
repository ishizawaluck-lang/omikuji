            font-size: 20px;

        }

        .already {
            color: #d62828;
            font-size: 24px;
            font-weight: bold;
        }

        button {
            font-size: 25px;
            padding: 18px 45px;
            border: none;
            border-radius: 15px;
            background: #e63946;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #c92f3b;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }
    </style>

        // 今日の日付を取得する
        function getToday() {

            const now = new Date();

            return now.getFullYear()
                + "-"
                + (now.getMonth() + 1)
                + "-"
                + now.getDate();

        }


        // おみくじを引く
        function omikuji() {

            // 今日の日付
            const today = getToday();

            // 前回引いた日付を確認
            const lastDate = localStorage.getItem("omikujiDate");


            // 今日すでに引いている場合
            if (lastDate === today) {

                document.getElementById("result").innerHTML = `
                    <div class="already">
                        ⚠️ 今日はもうおみくじを引きました！
                    </div>

                    <div class="message">
                        また明日引いてね！
                    </div>
                `;

                document.getElementById("omikujiButton").disabled = true;

                return;
            }


            // ランダムに結果を選ぶ
            const random =
                Math.floor(Math.random() * results.length);

            const result = results[random];


            // 結果を表示
            let html = "";

            html += `
                <div class="name">
                    ${result.name}
                </div>
            `;

            html += `
                <div class="message">
                    ${result.message}
                </div>
            `;


            if (result.item) {

                html += `
                    <div class="item">
                        🍀 ラッキーアイテム：
                        ${result.item}
                    </div>
                `;

            }


            document.getElementById("result").innerHTML = html;


            // 今日引いたことを記録
            localStorage.setItem("omikujiDate", today);


            // ボタンを無効化
            document.getElementById("omikujiButton").disabled = true;

        }


        // ページを開いたときにも確認
        window.onload = function() {

            const today = getToday();

            const lastDate =
                localStorage.getItem("omikujiDate");


            if (lastDate === today) {

                document.getElementById("result").innerHTML = `
                    <div class="already">
                        ⚠️ 今日はもう引きました！
                    </div>

                    <div class="message">
                        また明日引いてね！
                    </div>
                `;

                document.getElementById("omikujiButton").disabled = true;

            }

        };
