<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OMIKUJI</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% 20%,
            #24304d 0%,
            #0b1020 35%,
            #03050b 100%
        );

    min-height:100vh;
}

button{
    font-family:inherit;
}

.screen{
    display:none;
    min-height:100vh;
}

.screen.active{
    display:block;
}


/* ================================
   HOME
================================ */

.home{
    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:45px 20px 60px;
}

.logo{
    font-size:58px;
    font-weight:900;

    letter-spacing:12px;

    text-shadow:
        0 0 10px rgba(255,255,255,.4),
        0 0 35px rgba(120,180,255,.4);
}

.subtitle{
    margin-top:5px;
    margin-bottom:30px;

    color:#aab5d0;
    letter-spacing:3px;
}


/* ================================
   MAIN BOX
================================ */

.omikuji-box{
    width:min(92%,600px);

    padding:35px 25px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.04)
        );

    border:1px solid rgba(255,255,255,.14);

    box-shadow:
        0 20px 70px rgba(0,0,0,.5),
        inset 0 0 40px rgba(255,255,255,.03);

    text-align:center;
}

.omikuji-symbol{
    font-size:95px;

    filter:
        drop-shadow(0 0 20px rgba(255,210,80,.5));

    margin-bottom:20px;
}


/* ================================
   DRAW BUTTON
================================ */

.draw-button{
    width:100%;

    padding:21px;

    border:1px solid rgba(255,255,255,.25);

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #202d49,
            #10182b
        );

    color:#fff;

    font-size:21px;
    font-weight:900;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 8px 30px rgba(0,0,0,.4);

    transition:.2s;
}

.draw-button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 12px 40px rgba(100,160,255,.25);
}

.draw-button:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}


/* ================================
   CURRENCY
================================ */

.currency-area{
    width:min(92%,600px);

    display:flex;
    gap:12px;

    margin-top:18px;
}

.currency-box{
    flex:1;

    padding:14px;

    border-radius:15px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.1);

    text-align:center;
}

.currency-title{
    font-size:12px;
    color:#9eabc5;
}

.currency-value{
    margin-top:4px;

    font-size:23px;
    font-weight:900;
}


/* ================================
   MENU BUTTON
================================ */

.home-buttons{
    width:min(92%,600px);

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;

    margin-top:20px;
}

.menu-button{
    padding:18px 8px;

    border:1px solid rgba(255,255,255,.12);

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.04)
        );

    color:#fff;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.menu-button:hover{
    transform:translateY(-3px);

    background:
        rgba(255,255,255,.16);
}


/* ================================
   TEST
================================ */

.test-area{
    width:min(92%,600px);

    margin-top:22px;
}

.test-title{
    text-align:center;

    color:#8996b3;

    font-size:12px;

    letter-spacing:2px;

    margin-bottom:10px;
}

.test-buttons{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;
}

.test-button{
    padding:12px 5px;

    border:1px solid rgba(255,255,255,.1);

    border-radius:12px;

    background:#11182a;

    color:#d9e0f0;

    cursor:pointer;

    font-weight:bold;
}

.test-button:hover{
    background:#1d2942;
}


/* ================================
   RESULT
================================ */

.result{
    display:none;

    margin-top:25px;
}

.result-card{
    padding:25px;

    border-radius:20px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid rgba(255,255,255,.15);
}

.result-name{
    font-size:36px;

    font-weight:900;
}

.result-text{
    margin-top:12px;

    line-height:1.8;

    color:#d7dcec;
}


/* ================================
   PAGE
================================ */

.page{
    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:80px 20px 40px;
}

.page-title{
    font-size:36px;

    font-weight:900;

    letter-spacing:4px;

    margin-bottom:25px;
}


/* ================================
   BACK
================================ */

.back{
    position:fixed;

    top:18px;
    left:18px;

    z-index:1000;

    width:50px;
    height:50px;

    border:1px solid rgba(255,255,255,.2);

    border-radius:50%;

    background:
        rgba(5,8,15,.85);

    color:#fff;

    font-size:25px;

    cursor:pointer;
}


/* ================================
   COLLECTION
================================ */

.collection-grid{
    width:min(95%,850px);

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(150px,1fr));

    gap:12px;
}

.collection-item{
    min-height:90px;

    border-radius:17px;

    border:1px solid rgba(255,255,255,.1);

    padding:12px;

    font-weight:900;

    cursor:pointer;

    color:#fff;
}

.collection-item.obtained{
    background:
        linear-gradient(
            145deg,
            #273b68,
            #111a32
        );

    box-shadow:
        0 8px 25px rgba(0,0,0,.3);
}

.collection-item.locked{
    background:#151a25;

    color:#596176;

    cursor:not-allowed;
}


/* ================================
   MODAL
================================ */

.modal-overlay{
    position:fixed;

    inset:0;

    z-index:3000;

    background:
        rgba(0,0,0,.8);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.modal-overlay.active{
    display:flex;
}

.modal{
    width:min(94%,600px);

    max-height:90vh;

    overflow:auto;

    padding:28px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #17213a,
            #090d18
        );

    border:1px solid rgba(255,255,255,.15);

    text-align:center;
}

.modal-title{
    font-size:30px;

    font-weight:900;
}

.modal-text{
    margin:20px 0;

    line-height:1.8;

    color:#d6dced;
}

.action-button{
    width:100%;

    padding:15px;

    margin-top:10px;

    border:0;

    border-radius:13px;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;
}

.primary{
    background:#304b83;
    color:#fff;
}

.secondary{
    background:#252b39;
    color:#fff;
}


/* ================================
   MISSIONS
================================ */

.mission{
    width:min(95%,700px);

    padding:20px;

    margin-bottom:14px;

    border-radius:18px;

    background:
        rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.1);
}

.mission h3{
    margin-top:0;
}

.progress{
    height:10px;

    background:#252a38;

    border-radius:10px;

    overflow:hidden;

    margin:12px 0;
}

.progress-bar{
    height:100%;

    background:
        linear-gradient(
            90deg,
            #6c8fe8,
            #a8c4ff
        );
}

.reward-button{
    padding:11px 18px;

    border:0;

    border-radius:10px;

    background:#304b83;

    color:#fff;

    cursor:pointer;
}

.reward-button:disabled{
    background:#333947;

    color:#777f93;

    cursor:not-allowed;
}


/* ================================
   SHOP
================================ */

.shop-box{
    width:min(92%,600px);

    min-height:320px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #18213a,
            #090d18
        );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 15px 50px rgba(0,0,0,.4);

    text-align:center;
}

.shop-coming{
    font-size:40px;

    font-weight:900;

    letter-spacing:5px;

    color:#dce5ff;
}


/* ================================
   EFFECT
================================ */

#effect{
    position:fixed;

    inset:0;

    z-index:9999;

    display:none;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#000;
}

#effectGraphics{
    position:absolute;

    inset:0;

    overflow:hidden;
}

.effect-rays{
    position:absolute;

    width:180vmax;
    height:180vmax;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
        repeating-conic-gradient(
            transparent 0deg 7deg,
            rgba(255,220,100,.2) 8deg 11deg,
            transparent 12deg 20deg
        );

    animation:
        rotate 12s linear infinite;
}

.effect-light{
    position:absolute;

    left:50%;
    top:50%;

    width:15vmin;
    height:15vmin;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 40px #fff,
        0 0 100px gold,
        0 0 220px gold;

    animation:pulse 3s infinite;
}

.effect-text{
    position:relative;

    z-index:5;

    color:#fff;

    font-size:70px;

    font-weight:900;

    opacity:0;

    text-align:center;

    text-shadow:
        0 0 20px gold,
        0 0 50px #fff;
}

.effect-text.show{
    animation:appear 1.2s forwards;
}

.skip{
    position:absolute;

    top:20px;
    right:20px;

    z-index:20;

    padding:12px 18px;

    border:1px solid rgba(255,255,255,.4);

    border-radius:12px;

    background:
        rgba(0,0,0,.7);

    color:#fff;

    cursor:pointer;
}


/* ================================
   YOUTUBE
================================ */

#videoContainer{
    position:absolute;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:#000;
}

#youtubeFrame{
    width:min(90vw,900px);

    aspect-ratio:16/9;

    border:0;
}


/* ================================
   ANIMATION
================================ */

@keyframes rotate{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }

}

@keyframes pulse{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(.4);

        opacity:.25;
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(2);

        opacity:1;
    }

}

@keyframes appear{

    from{
        transform:scale(.2);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    .logo{
        font-size:40px;
        letter-spacing:7px;
    }

    .home-buttons{
        grid-template-columns:1fr;
    }

    .test-buttons{
        grid-template-columns:1fr;
    }

    .currency-area{
        flex-direction:column;
    }

    .effect-text{
        font-size:43px;
    }

}

</style>
</head>

name:"大吉",
text:"大体のことがうまくいく　ラッキーアイテム：チームワーク",
type:"great"
},

{
name:"超特大吉",
text:"誰かからお賽銭がもらえるかも　ラッキーアイテム：我慢",
type:"super"
}

];


/* =====================================================
   保存データ
===================================================== */

let data =
JSON.parse(
localStorage.getItem("omikujiData") || "{}"
);


if(typeof data.coins !== "number")
data.coins=0;


if(typeof data.freeDraws !== "number")
data.freeDraws=0;


if(typeof data.lastLogin !== "string")
data.lastLogin="";


if(!Array.isArray(data.obtained))
data.obtained=[];


if(typeof data.drawCount !== "number")
data.drawCount=0;


if(!data.missions)
data.missions={};


if(!data.claimed)
data.claimed={};


let selectedResult=null;

let effectTimer=null;


/* =====================================================
   SAVE
===================================================== */

function save(){

localStorage.setItem(
"omikujiData",
JSON.stringify(data)
);

}


/* =====================================================
   DATE
===================================================== */

function today(){

const d=new Date();

return d.getFullYear()
+"-"
+String(d.getMonth()+1).padStart(2,"0")
+"-"
+String(d.getDate()).padStart(2,"0");

}


/* =====================================================
   LOGIN BONUS
===================================================== */

function loginBonus(){

const date=today();

if(data.lastLogin!==date){

data.lastLogin=date;

data.freeDraws++;

save();

alert(
"🎁 LOGIN BONUS\n\n"+
"無料おみくじを1回獲得しました！"
);

}

}


/* =====================================================
   PAGE
===================================================== */

function openPage(page){

document
.querySelectorAll(".screen")
.forEach(x=>{
x.classList.remove("active");
});


document
.getElementById(page+"Screen")
.classList.add("active");


if(page==="collection")
renderCollection();


if(page==="missions")
renderMissions();

}


function goHome(){

document
.querySelectorAll(".screen")
.forEach(x=>{
x.classList.remove("active");
});


document
.getElementById("homeScreen")
.classList.add("active");

}


/* =====================================================
   COINS
===================================================== */

function updateCoins(){

document
.getElementById("coinCount")
.textContent=data.coins;

}


function updateFreeDraws(){

document
.getElementById("freeDrawCount")
.textContent=data.freeDraws;

}


/* =====================================================
   COIN REWARD
===================================================== */

function coinReward(result){

if(result.name==="超特大吉")
return 100;

if(result.name==="大吉")
return 50;

if(result.type==="unique")
return 10;

if([
"末小吉",
"凶",
"小凶",
"半凶",
"末凶",
"大凶"
].includes(result.name))
return 1;

return 5;

}


/* =====================================================
   REAL DRAW
===================================================== */

function drawRealOmikuji(){

/*
無料分がある場合は
無料分を先に使用
*/

if(data.freeDraws>0){

data.freeDraws--;

}else{

/*
無料分がなければ
コインを1枚消費
*/

if(data.coins<=0){

alert(
"コインが足りません！\n\n"+
"ログインボーナスやミッションで\n"+
コインを集めよう！"
);

return;

}

data.coins--;

}


/* =====================
   RESULT
===================== */

const result=
omikuji[
Math.floor(
Math.random()*omikuji.length
)
];


data.drawCount++;


registerResult(result);


data.coins+=coinReward(result);


updateMissions(result);


save();


updateCoins();

updateFreeDraws();


playResult(result);

}


/* =====================================================
   REGISTER
===================================================== */

function registerResult(result){

if(!data.obtained.includes(result.name)){

data.obtained.push(result.name);

}

}


/* =====================================================
   MISSION UPDATE
===================================================== */

function updateMissions(result){

data.missions.once=true;


if(data.drawCount>=10)
data.missions.ten=true;


if(data.drawCount>=30)
data.missions.thirty=true;


if(result.type==="unique")
data.missions.unique=true;


if(result.name==="超特大吉")
data.missions.super=true;


if(data.obtained.length>=omikuji.length)
data.missions.complete=true;

}


/* =====================================================
   TEST
===================================================== */

function testRandom(){

const result=
omikuji[
Math.floor(
Math.random()*omikuji.length
)
];

playResult(result);

}


function testGreat(){

const result=
omikuji.find(
x=>x.name==="大吉"
);

playResult(result);

}


function testSuper(){

const result=
omikuji.find(
x=>x.name==="超特大吉"
);

playResult(result);

}


/* =====================================================
   RESULT DISPLAY
===================================================== */

function showResult(result){

document
.getElementById("result")
.style.display="block";


document
.getElementById("resultName")
.textContent=result.name;


document
.getElementById("resultText")
.textContent=result.text;

}


/* =====================================================
   PLAY RESULT
===================================================== */

function playResult(result){

if(
result.type==="great" ||
result.type==="super"
){

playLuxuryEffect(result);

return;

}


if(
result.video &&
result.video.platform==="youtube"
){

playYouTubeEffect(result);

return;

}


/*
TikTokはHTMLから
直接動画を取得しない。

そのため通常演出。
*/

showSimpleEffect(result);

}


/* =====================================================
   SIMPLE EFFECT
===================================================== */

function showSimpleEffect(result){

const effect=
document.getElementById("effect");


const text=
document.getElementById("effectText");


const graphics=
document.getElementById("effectGraphics");


const video=
document.getElementById("videoContainer");


video.style.display="none";


graphics.style.display="block";


effect.style.display="flex";


effect.style.background="#080b14";


text.textContent=result.name;


text.classList.remove("show");


/*
再描画させてアニメーションを確実に発生
*/

void text.offsetWidth;


text.classList.add("show");


effectTimer=setTimeout(()=>{

finishEffect();

showResult(result);

},2200);

}


/* =====================================================
   LUXURY EFFECT
===================================================== */

function playLuxuryEffect(result){

const effect=
document.getElementById("effect");


const graphics=
document.getElementById("effectGraphics");


const video=
document.getElementById("videoContainer");


const text=
document.getElementById("effectText");


if(effectTimer){

clearTimeout(effectTimer);

effectTimer=null;

}


video.style.display="none";

graphics.style.display="block";


effect.style.display="flex";


effect.style.background="#000";


text.textContent="";

text.classList.remove("show");


/*
完全暗転
*/

setTimeout(()=>{

effect.style.background=
"radial-gradient("+
"circle at center,"+
"#ffffff 0%,"+
"#e5b936 15%,"+
"#51410b 35%,"+
"#050505 75%"+
")";

},1000);


/*
文字登場
*/

setTimeout(()=>{

text.textContent=result.name;

void text.offsetWidth;

text.classList.add("show");

},2500);


/*
終了
*/

effectTimer=setTimeout(()=>{

finishEffect();

showResult(result);

},5500);

}


/* =====================================================
   YOUTUBE EFFECT
===================================================== */

function playYouTubeEffect(result){

const effect=
document.getElementById("effect");


const video=
document.getElementById("videoContainer");


const graphics=
document.getElementById("effectGraphics");


const frame=
document.getElementById("youtubeFrame");


const text=
document.getElementById("effectText");


effect.style.display="flex";


effect.style.background="#000";


graphics.style.display="none";


text.classList.remove("show");

text.textContent="";


let url=
"https://www.youtube.com/embed/"
+
result.video.id
+
"?autoplay=1&rel=0&modestbranding=1";


if(typeof result.video.start==="number"){

url+="&start="+result.video.start;

}


frame.src=url;


video.style.display="flex";


let duration=10000;


if(
typeof result.video.start==="number" &&
typeof result.video.end==="number"
){

duration=
(result.video.end-result.video.start)*1000
+1500;

}


effectTimer=setTimeout(()=>{

finishEffect();

showResult(result);

},duration);

}


/* =====================================================
   SKIP
===================================================== */

function skipEffect(){

if(effectTimer){

clearTimeout(effectTimer);

effectTimer=null;

}


finishEffect();


if(selectedResult){

showResult(selectedResult);

selectedResult=null;

}

}


/* =====================================================
   FINISH EFFECT
===================================================== */

function finishEffect(){

const effect=
document.getElementById("effect");


const frame=
document.getElementById("youtubeFrame");


const video=
document.getElementById("videoContainer");


const text=
document.getElementById("effectText");


effect.style.display="none";


video.style.display="none";


frame.src="";


text.textContent="";


text.classList.remove("show");

}


/* =====================================================
   COLLECTION
===================================================== */

function renderCollection(){

const grid=
document.getElementById(
"collectionGrid"
);


grid.innerHTML="";


omikuji.forEach(result=>{

const obtained=
data.obtained.includes(
result.name
);


const button=
document.createElement("button");


button.className=
"collection-item "
+
(
obtained
?"obtained"
:"locked"
);


button.textContent=
obtained
?result.name
:"🔒 未入手";


if(obtained){

button.onclick=()=>{

openDetail(result);

};

}


grid.appendChild(button);

});

}


/* =====================================================
   COLLECTION DETAIL
===================================================== */

function openDetail(result){

selectedResult=result;


document
.getElementById("detailTitle")
.textContent=result.name;


document
.getElementById("detailText")
.textContent=result.text;


document
.getElementById("detailOverlay")
.classList.add("active");

}


function closeDetail(){

document
.getElementById("detailOverlay")
.classList.remove("active");


selectedResult=null;

}


/* =====================================================
   COLLECTION EFFECT
===================================================== */

function watchCollectionEffect(){

if(!selectedResult)
return;


const result=selectedResult;


closeDetail();


playResult(result);

}


/* =====================================================
   MISSIONS
===================================================== */

function renderMissions(){

const list=
document.getElementById(
"missionList"
);


list.innerHTML="";


createMission(
list,
"once",
"おみくじを1回引こう",
data.drawCount>=1,
"100コイン",
100
);


createMission(
list,
"ten",
"おみくじを10回引こう",
data.drawCount>=10,
"1000コイン",
1000
);


createMission(
list,
"thirty",
"おみくじを30回引こう",
data.drawCount>=30,
"2000コイン",
2000
);


createMission(
list,
"unique",
"ユニークくじを1枚引こう",
data.missions.unique===true,
"2000カウンシー",
0,
"unique"
);


createMission(
list,
"super",
"超特大吉を1枚引こう",
data.missions.super===true,
"5000カウンシー",
0,
"super"
);


createMission(
list,
"complete",
"全種類をコンプリートしよう",
data.obtained.length>=omikuji.length,
"3000コイン ＋ おみくじ別班",
3000,
"complete"
);

}


/* =====================================================
   CREATE MISSION
===================================================== */

function createMission(
parent,
id,
title,
complete,
reward,
coins,
special=""
){

let progress=0;

let max=1;


if(id==="once"){

progress=
Math.min(
data.drawCount,
1
);

max=1;

}


if(id==="ten"){

progress=
Math.min(
data.drawCount,
10
);

max=10;

}


if(id==="thirty"){

progress=
Math.min(
data.drawCount,
30
);

max=30;

}


if(id==="complete"){

progress=
Math.min(
data.obtained.length,
omikuji.length
);

max=omikuji.length;

}


const percentage=
Math.round(
progress/max*100
);


const claimed=
data.claimed[id]===true;


const div=
document.createElement("div");


div.className="mission";


div.innerHTML=`

<h3>${title}</h3>

<div class="progress">

<div
class="progress-bar"
style="width:${percentage}%">
</div>

</div>

<div>
進行度：
${progress}/${max}
</div>

<p>
報酬：${reward}
</p>

<button
class="reward-button"
${(!complete || claimed)?"disabled":""}
onclick="claimMission('${id}','${special}',${coins})">

${
claimed
?"受け取り済み"
:complete
?"受け取る"
:"未達成"
}

</button>

`;


parent.appendChild(div);

}


/* =====================================================
   CLAIM MISSION
===================================================== */

function claimMission(
id,
special,
coins
){

if(data.claimed[id])
return;


if(coins>0){

data.coins+=coins;

}


if(special==="unique"){

alert(
"ミッション達成！\n"+
"2000カウンシーを獲得しました！"
);

}


if(special==="super"){

alert(
"ミッション達成！\n"+
"5000カウンシーを獲得しました！"
);

}


if(special==="complete"){

alert(
"ミッション達成！\n\n"+
"称号「おみくじ別班」を獲得しました！"
);

}


data.claimed[id]=true;


save();


updateCoins();


renderMissions();

}


/* =====================================================
   INITIALIZE
===================================================== */

loginBonus();

updateCoins();

updateFreeDraws();

</script>
