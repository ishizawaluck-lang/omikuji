<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>おみくじ</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
    background:
        linear-gradient(135deg,#f8f1df,#fffaf0);
    color:#222;
    min-height:100vh;
}

button{
    font-family:inherit;
}

.screen{
    display:none;
    min-height:100vh;
}

.screen.active{
    display:block;
}

.home{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:45px 20px;
}

.logo{
    font-size:48px;
    font-weight:900;
    letter-spacing:8px;
    margin-bottom:10px;
}

.subtitle{
    color:#777;
    margin-bottom:35px;
}

.omikuji-box{
    width:min(92%,520px);
    background:white;
    border-radius:28px;
    padding:35px 25px;
    box-shadow:0 15px 45px rgba(0,0,0,.12);
    text-align:center;
}

.omikuji-symbol{
    font-size:90px;
    margin-bottom:15px;
}

.draw-button{
    width:100%;
    padding:20px;
    border:0;
    border-radius:18px;
    background:#222;
    color:white;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.draw-button:hover{
    transform:translateY(-2px);
    opacity:.9;
}

.draw-button:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.home-buttons{
    width:min(92%,520px);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}

.menu-button{
    padding:17px 8px;
    border:0;
    border-radius:16px;
    background:white;
    box-shadow:0 7px 22px rgba(0,0,0,.1);
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.menu-button:hover{
    transform:translateY(-2px);
}

.coin-display{
    margin-top:22px;
    background:white;
    border-radius:14px;
    padding:10px 20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.result{
    margin-top:25px;
    display:none;
}

.result-card{
    padding:25px;
    border-radius:20px;
    background:#fffaf0;
    border:2px solid #e5d3a1;
}

.result-name{
    font-size:34px;
    font-weight:900;
    margin-bottom:15px;
}

.result-text{
    font-size:17px;
    line-height:1.8;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.overlay.active{
    display:flex;
}

.modal{
    width:min(94%,600px);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:25px;
    padding:25px;
}

.back{
    position:fixed;
    top:18px;
    left:18px;
    z-index:1100;
    border:0;
    background:rgba(0,0,0,.75);
    color:white;
    width:48px;
    height:48px;
    border-radius:50%;
    font-size:23px;
    cursor:pointer;
}

.page-title{
    text-align:center;
    font-size:32px;
    font-weight:900;
    margin-bottom:25px;
}

.collection-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
    gap:10px;
}

.collection-item{
    border:0;
    border-radius:15px;
    padding:16px 8px;
    min-height:80px;
    cursor:pointer;
    font-weight:bold;
}

.collection-item.obtained{
    background:#fff4c9;
    color:#222;
}

.collection-item.locked{
    background:#ddd;
    color:#888;
    cursor:not-allowed;
}

.detail-title{
    font-size:30px;
    font-weight:900;
    text-align:center;
}

.detail-text{
    line-height:1.8;
    margin:20px 0;
    text-align:center;
}

.action-button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:13px;
    margin-top:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.primary{
    background:#222;
    color:white;
}

.secondary{
    background:#eee;
}

.mission{
    background:#f7f7f7;
    border-radius:18px;
    padding:18px;
    margin-bottom:12px;
}

.mission h3{
    margin-top:0;
}

.progress{
    height:10px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin:12px 0;
}

.progress-bar{
    height:100%;
    background:#222;
    width:0%;
}

.reward-button{
    padding:11px 16px;
    border:0;
    border-radius:10px;
    background:#222;
    color:white;
    cursor:pointer;
}

.reward-button:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.shop-coming{
    text-align:center;
    padding:80px 20px;
    font-size:32px;
    font-weight:bold;
}

#effect{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
}

.effect-light{
    position:absolute;
    width:15vmin;
    height:15vmin;
    border-radius:50%;
    background:white;
    box-shadow:
        0 0 50px white,
        0 0 120px gold,
        0 0 250px gold;
    animation:lightPulse 3s infinite;
}

.effect-rays{
    position:absolute;
    width:160vmax;
    height:160vmax;
    background:
        repeating-conic-gradient(
            transparent 0deg 8deg,
            rgba(255,220,100,.22) 9deg 11deg,
            transparent 12deg 20deg
        );
    animation:rotate 12s linear infinite;
}

.effect-text{
    position:relative;
    z-index:3;
    color:white;
    font-size:65px;
    font-weight:900;
    text-shadow:
        0 0 20px gold,
        0 0 50px white;
    animation:appear 1.2s ease-out;
}

.skip{
    position:absolute;
    top:20px;
    right:20px;
    z-index:10;
    padding:12px 18px;
    border:1px solid rgba(255,255,255,.5);
    border-radius:12px;
    background:rgba(0,0,0,.6);
    color:white;
    cursor:pointer;
}

@keyframes rotate{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes lightPulse{
    0%,100%{transform:scale(.4);opacity:.3}
    50%{transform:scale(2);opacity:1}
}

@keyframes appear{
    from{
        transform:scale(.2);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

@media(max-width:500px){
    .logo{
        font-size:38px;
    }

    .home-buttons{
        grid-template-columns:1fr;
    }

    .effect-text{
        font-size:42px;
    }
}
</style>
</head>

<body>

<!-- =========================
     ホーム
========================= -->

<div id="homeScreen" class="screen active">

<div class="home">

<div class="logo">おみくじ</div>
<div class="subtitle">一日一回、今日の運勢を。</div>

<div class="omikuji-box">

<div class="omikuji-symbol">🎴</div>

<button
    id="drawButton"
    class="draw-button"
    onclick="drawOmikuji()">
    おみくじを引く
</button>

<div id="result" class="result">
<div class="result-card">
<div id="resultName" class="result-name"></div>
<div id="resultText" class="result-text"></div>
</div>
</div>

</div>

<div class="home-buttons">

<button
    class="menu-button"
    onclick="openPage('collection')">
    📖 図鑑
</button>

<button
    class="menu-button"
    onclick="openPage('shop')">
    🛒 ショップ
</button>

<button
    class="menu-button"
    onclick="openPage('missions')">
    🎯 ミッション
</button>

</div>

<div class="coin-display">
🪙 コイン：<span id="coinCount">0</span>
</div>

</div>
</div>


<!-- =========================
     図鑑
========================= -->

<div id="collectionScreen" class="screen">

<button class="back" onclick="goHome()">←</button>

<div class="home">

<div class="page-title">📖 おみくじ図鑑</div>

<div id="collectionGrid" class="collection-grid"></div>

</div>
</div>


<!-- =========================
     ショップ
========================= -->

<div id="shopScreen" class="screen">

<button class="back" onclick="goHome()">←</button>

<div class="home">

<div class="page-title">🛒 ショップ</div>

<div class="omikuji-box">

<div class="shop-coming">
近日公開
</div>

</div>

</div>
</div>


<!-- =========================
     ミッション
========================= -->

<div id="missionsScreen" class="screen">

<button class="back" onclick="goHome()">←</button>

<div class="home">

<div class="page-title">🎯 ミッション</div>

<div id="missionList" style="width:min(92%,600px)"></div>

</div>
</div>


<!-- =========================
     図鑑詳細
========================= -->

<div id="detailOverlay" class="overlay">

<div class="modal">

<div id="detailTitle" class="detail-title"></div>

<div id="detailText" class="detail-text"></div>

<button
    class="action-button primary"
    onclick="watchCollectionEffect()">
    🎬 演出を見る
</button>

<button
    class="action-button secondary"
    onclick="closeDetail()">
    閉じる
</button>

</div>
</div>


<!-- =========================
     演出
========================= -->

<div id="effect">

<div class="effect-rays"></div>

<div class="effect-light"></div>

<button
    class="skip"
    onclick="skipEffect()">
    スキップ
</button>

<div id="effectText" class="effect-text"></div>

</div>


<script>

/* ==========================================
   おみくじデータ
========================================== */

const omikuji = [

{
name:"小吉",
text:"割りばしがうまく割れるかも",
type:"normal"
},

{
name:"中吉",
text:"茶柱立つかも",
type:"normal"
},

{
name:"吉",
text:"自分の思いついたことやってみたら成功するかも",
type:"normal"
},

{
name:"半吉",
text:"ワンチャン褒められるよ",
type:"normal"
},

{
name:"末吉",
text:"まあ別に何も起こらない",
type:"normal"
},

{
name:"末小吉",
text:"自分の発言には気を付けよう　ラッキーアイテム：思いやりの精神",
type:"normal"
},

{
name:"凶",
text:"一回はこけるよ　ラッキーアイテム：危機感",
type:"normal"
},

{
name:"小凶",
text:"立ち眩みすることがあるよ　ラッキーアイテム：健康",
type:"normal"
},

{
name:"半凶",
text:"冷蔵庫を開けたら物が何個か落ちてきます　ラッキーアイテム：整理整頓",
type:"normal"
},

{
name:"末凶",
text:"なにかが机の間に落ちていやな気分になります　ラッキーアイテム：長い棒",
type:"normal"
},

{
name:"大凶",
text:"今日は少し注意して過ごそう　ラッキーアイテム：聖書",
type:"normal"
},

{
name:"狩野英孝吉",
text:"ライトが割れました　ラッキーアイテム：如意棒",
type:"unique"
},

{
name:"ようごん吉",
text:"ようよう白く成りゆく山際　ラッキーアイテム：清少納GON",
type:"unique"
},

{
name:"ディオ吉",
text:"お前は今まで食ってきたパンの枚数を覚えているのか　ラッキーアイテム：記憶力/勇気",
type:"unique"
},

{
name:"バイオ吉",
text:"お前も今日から家族だ　ラッキーアイテム：好き嫌いしない口",
type:"unique"
},

{
name:"真島吉",
text:"そこの桐生ちゃん止まりなさい　ラッキーアイテム：桐生一馬",
type:"unique"
},

{
name:"鶏吉",
text:"do you know what time it is?　ラッキーアイテム：トランシーバー",
type:"unique"
},

{
name:"レヴォリューション吉",
text:"夏を刺激するような勢いのある一日になりそう！　ラッキーアイテム：松岡修造",
type:"unique"
},

{
name:"丸亀吉",
text:"今日はかなり荒れ模様。落ち着いて行動しよう　ラッキーアイテム：うどん",
type:"unique"
},

{
name:"丸亀吉２",
text:"今日は何事にも冷静に対応しよう　ラッキーアイテム：手打ち麺",
type:"unique"
},

{
name:"布団ちゃん吉",
text:"～君と夏の終わり～　ちゃっこい茶割り　ここの鶏皮ってカリカリ？　ラッキーアイテム：放屁",
type:"unique"
},

{
name:"陣内智則吉",
text:"笑いのニューウェーブはこの男ーーー！！！　ラッキーアイテム：ノリのよさ",
type:"unique"
},

{
name:"GON吉",
text:"お前！それは犬のほうを助けなきゃダメだろ！！　ラッキーアイテム：猫",
type:"unique"
},

{
name:"葉吉",
text:"おっけー無理しね　ラッキーアイテム：あきらめも肝心",
type:"unique"
},

{
name:"乙骨吉",
text:"よかったーーーwwwwwwwwwwwwwwwはっwwwwwwwww　ラッキーアイテム：安心",
type:"unique"
},

{
name:"偽骨吉",
text:"今日はゆるくいこう　ラッキーアイテム：ゆるゆる",
type:"unique"
},

{
name:"クラピカ吉",
text:"ジャッチメントチェーン　ラッキーアイテム：クルタ族の目",
type:"unique"
},

{
name:"偽ピカ吉",
text:"エンペラーペンギンタイム　ラッキーアイテム：ぺんぎん",
type:"unique"
},

{
name:"MASAAKI吉",
text:"吉を見たその日から運命を感じたんだ　ラッキーアイテム：探索力",
type:"unique"
},

{
name:"大吉",
text:"大体のことがうまくいく　ラッキーアイテム：チームワーク",
type:"great"
},

{
name:"超特大吉",
text:"誰かからお賽銭がもらえるかも　ラッキーアイテム：我慢",
type:"super"
}

];


/* ==========================================
   保存データ
========================================== */

let data =
JSON.parse(
localStorage.getItem("omikujiData") || "{}"
);

if(!data.coins) data.coins = 0;

if(!data.obtained) data.obtained = [];

if(!data.drawCount) data.drawCount = 0;

if(!data.lastDraw) data.lastDraw = "";

if(!data.missions) data.missions = {};

if(!data.claimed) data.claimed = {};

if(!data.title) data.title = false;


let selectedResult = null;

let effectTimer = null;


/* ==========================================
   保存
========================================== */

function save(){

localStorage.setItem(
"omikujiData",
JSON.stringify(data)
);

}


/* ==========================================
   今日の日付
========================================== */

function today(){

const d = new Date();

return d.getFullYear()
+"-"
+String(d.getMonth()+1).padStart(2,"0")
+"-"
+String(d.getDate()).padStart(2,"0");

}


/* ==========================================
   画面切り替え
========================================== */

function openPage(page){

document
.querySelectorAll(".screen")
.forEach(x=>x.classList.remove("active"));

document
.getElementById(page+"Screen")
.classList.add("active");

if(page==="collection"){
renderCollection();
}

if(page==="missions"){
renderMissions();
}

updateCoins();

}


function goHome(){

document
.querySelectorAll(".screen")
.forEach(x=>x.classList.remove("active"));

document
.getElementById("homeScreen")
.classList.add("active");

updateCoins();

}


/* ==========================================
   コイン
========================================== */

function updateCoins(){

document
.getElementById("coinCount")
.textContent =
data.coins;

}


/* ==========================================
   コイン報酬
========================================== */

function getCoinReward(result){

if(result.name==="超特大吉"){
return 100;
}

if(result.name==="大吉"){
return 50;
}

if(result.type==="unique"){
return 10;
}

if(
[
"末小吉",
"凶",
"小凶",
"半凶",
"末凶",
"大凶"
].includes(result.name)
){
return 1;
}

return 5;

}


/* ==========================================
   おみくじを引く
========================================== */

function drawOmikuji(){

if(data.lastDraw===today()){

alert(
"今日はもうおみくじを引きました！\nまた明日引けます。"
);

return;

}


const result =
omikuji[
Math.floor(
Math.random()*omikuji.length
)
];

data.lastDraw = today();

data.drawCount++;

if(!data.obtained.includes(result.name)){

data.obtained.push(result.name);

}

data.coins +=
getCoinReward(result);


/* ミッション進行 */

data.missions.once = true;

if(data.drawCount>=10){
data.missions.ten = true;
}

if(data.drawCount>=30){
data.missions.thirty = true;
}

if(result.name==="超特大吉"){
data.missions.super = true;
}

if(result.type==="unique"){
data.missions.unique = true;
}


/* 全種類 */

if(
data.obtained.length >=
omikuji.length
){
data.missions.complete = true;
}


save();

showEffectForResult(result);

updateDrawButton();

}


/* ==========================================
   結果表示
========================================== */

function showResult(result){

document
.getElementById("result")
.style.display="block";

document
.getElementById("resultName")
.textContent =
result.name;

document
.getElementById("resultText")
.textContent =
result.text;

}


/* ==========================================
   演出
========================================== */

function showEffectForResult(result){

if(
result.type==="great" ||
result.type==="super"
){

playLuxuryEffect(
result,
()=>{
showResult(result);
}
);

}else{

showResult(result);

}

}


/* ==========================================
   豪華演出
========================================== */

function playLuxuryEffect(
result,
callback
){

const effect =
document.getElementById("effect");

const text =
document.getElementById("effectText");

effect.style.display="flex";

effect.style.background="#000";

text.textContent="";

setTimeout(()=>{

effect.style.background =
"radial-gradient(circle,#fff,#f6c542,#111)";

},2500);

setTimeout(()=>{

text.textContent =
result.name;

},4500);

effectTimer =
setTimeout(()=>{

finishEffect(callback);

},7000);

}


/* ==========================================
   演出スキップ
========================================== */

function skipEffect(){

if(effectTimer){

clearTimeout(effectTimer);

effectTimer=null;

}

finishEffect(
()=>{
if(selectedResult){

showResult(selectedResult);

}
}
);

}


/* ==========================================
   演出終了
========================================== */

function finishEffect(callback){

const effect =
document.getElementById("effect");

effect.style.display="none";

document
.getElementById("effectText")
.textContent="";

if(callback){
callback();
}

}


/* ==========================================
   図鑑
========================================== */

function renderCollection(){

const grid =
document.getElementById(
"collectionGrid"
);

grid.innerHTML="";

omikuji.forEach(result=>{

const obtained =
data.obtained.includes(
result.name
);

const button =
document.createElement("button");

button.className =
"collection-item "
+
(obtained
?"obtained"
:"locked");

button.textContent =
obtained
?result.name
:"🔒 未入手";

button.onclick=()=>{

if(!obtained)return;

openDetail(result);

};

grid.appendChild(button);

});

}


/* ==========================================
   図鑑詳細
========================================== */

function openDetail(result){

selectedResult =
result;

document
.getElementById("detailTitle")
.textContent =
result.name;

document
.getElementById("detailText")
.textContent =
result.text;

document
.getElementById("detailOverlay")
.classList.add("active");

}


/* ==========================================
   詳細を閉じる
========================================== */

function closeDetail(){

document
.getElementById("detailOverlay")
.classList.remove("active");

selectedResult=null;

}


/* ==========================================
   図鑑から演出を見る
========================================== */

function watchCollectionEffect(){

if(!selectedResult)return;

const result =
selectedResult;

closeDetail();

if(
result.type==="great" ||
result.type==="super"
){

playLuxuryEffect(
result,
()=>{}
);

}else{

/*
通常のおみくじは
シンプルな演出
*/

const effect =
document.getElementById("effect");

const text =
document.getElementById("effectText");

effect.style.display="flex";

effect.style.background="#111";

text.textContent =
result.name;

setTimeout(()=>{

effect.style.display="none";

text.textContent="";

},2500);

}

}


/* ==========================================
   ミッション
========================================== */

function renderMissions(){

const list =
document.getElementById(
"missionList"
);

list.innerHTML="";


createMission(
list,
"once",
"おみくじを1回引こう",
"1回引く",
"100コイン",
data.drawCount>=1,
100
);


createMission(
list,
"ten",
"おみくじを10回引こう",
"10回引く",
"1000コイン",
data.drawCount>=10,
1000
);


createMission(
list,
"thirty",
"おみくじを30回引こう",
"30回引く",
"2000コイン",
data.drawCount>=30,
2000
);


createMission(
list,
"unique",
"ユニークくじを1枚引こう",
"ユニークくじを引く",
"2000カウンシー",
data.missions.unique===true,
0,
"uniqueCurrency"
);


createMission(
list,
"super",
"超特大吉を1枚引こう",
"超特大吉を引く",
"5000カウンシー",
data.missions.super===true,
0,
"superCurrency"
);


createMission(
list,
"complete",
"全種類をコンプリートしよう",
"全種類入手",
"3000コイン ＋ おみくじ別班",
data.obtained.length>=omikuji.length,
3000,
"complete"
);

}


function createMission(
parent,
id,
title,
description,
reward,
complete,
coins,
special=""
){

const div =
document.createElement("div");

div.className="mission";

let progress=0;

if(id==="once"){
progress =
Math.min(data.drawCount,1);
}

if(id==="ten"){
progress =
Math.min(data.drawCount,10);
}

if(id==="thirty"){
progress =
Math.min(data.drawCount,30);
}

if(id==="complete"){
progress =
Math.min(
data.obtained.length,
omikuji.length
);
}

let max=1;

if(id==="ten")max=10;
if(id==="thirty")max=30;
if(id==="complete")max=omikuji.length;


let percentage =
(max===1
?(complete?100:0)
:Math.round(
progress/max*100
));


let claimed =
data.claimed[id]===true;


div.innerHTML=`

<h3>${title}</h3>

<div>${description}</div>

<div class="progress">
<div
class="progress-bar"
style="width:${percentage}%">
</div>
</div>

<div>
進行度：
${progress}/${max}
</div>

<p>
報酬：${reward}
</p>

<button
class="reward-button"
${(!complete || claimed)?"disabled":""}
onclick="claimMission('${id}','${special}',${coins})">

${
claimed
?"受け取り済み"
:complete
?"受け取る"
:"未達成"
}

</button>

`;

parent.appendChild(div);

}


/* ==========================================
   ミッション報酬
========================================== */

function claimMission(
id,
special,
coins
){

if(data.claimed[id]){
return;
}


/* コイン */

if(coins>0){

data.coins += coins;

}


/* カウンシー */

if(
special==="uniqueCurrency"
){

alert(
"ミッション達成！\n2000カウンシーを獲得しました！"
);

}

if(
special==="superCurrency"
){

alert(
"ミッション達成！\n5000カウンシーを獲得しました！"
);

}


/* 称号 */

if(
special==="complete"
){

data.title=true;

alert(
"称号「おみくじ別班」を獲得しました！"
);

}


data.claimed[id]=true;

save();

updateCoins();

renderMissions();

}


/* ==========================================
   引くボタン状態
========================================== */

function updateDrawButton(){

const button =
document.getElementById(
"drawButton"
);

if(data.lastDraw===today()){

button.disabled=true;

button.textContent=
"今日はもう引きました";

}else{

button.disabled=false;

button.textContent=
"おみくじを引く";

}

}


/* ==========================================
   初期化
========================================== */

updateCoins();

updateDrawButton();

</script>

</body>
</html>
