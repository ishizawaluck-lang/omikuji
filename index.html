<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
    color:#fff;
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 20%,rgba(64,93,180,.20),transparent 28%),
        radial-gradient(circle at 80% 25%,rgba(172,108,255,.14),transparent 25%),
        radial-gradient(circle at 50% 100%,rgba(44,127,201,.12),transparent 30%),
        linear-gradient(135deg,#030611,#0a1020 50%,#02040a);
}

button{
    font-family:inherit;
}

.screen{
    display:none;
    min-height:100vh;
}

.screen.active{
    display:block;
}

.home{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:60px 20px 70px;
}

.logo{
    font-size:clamp(40px,7vw,68px);
    font-weight:900;
    letter-spacing:10px;
    text-align:center;
    text-shadow:
        0 0 15px rgba(255,255,255,.4),
        0 0 45px rgba(111,153,255,.35);
}

.subtitle{
    color:#aeb8d2;
    margin:8px 0 30px;
    letter-spacing:3px;
    text-align:center;
}

.omikuji-box{
    position:relative;
    width:min(94%,620px);
    padding:35px 25px;
    border-radius:30px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.11),
            rgba(255,255,255,.035)
        );
    border:1px solid rgba(255,255,255,.13);
    box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.12);
    text-align:center;
}

.omikuji-symbol{
    font-size:90px;
    margin-bottom:20px;
    filter:drop-shadow(0 0 22px rgba(255,213,94,.35));
}

.draw-button{
    width:100%;
    padding:20px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:18px;
    background:linear-gradient(135deg,#22345a,#10192e);
    color:#fff;
    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.draw-button:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 45px rgba(75,120,255,.22);
}

.draw-button:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

.currency-area{
    width:min(94%,620px);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:18px;
}

.currency-box{
    padding:14px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.06);
    text-align:center;
}

.currency-title{
    font-size:12px;
    color:#98a5c3;
    letter-spacing:1px;
}

.currency-value{
    margin-top:4px;
    font-size:24px;
    font-weight:900;
}

.home-buttons{
    width:min(94%,620px);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}

.menu-button{
    padding:17px 8px;
    border:1px solid rgba(255,255,255,.11);
    border-radius:16px;
    background:rgba(255,255,255,.06);
    color:#fff;
    cursor:pointer;
    font-weight:900;
    transition:.2s;
}

.menu-button:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.10);
}

.test-area{
    width:min(94%,620px);
    margin-top:22px;
}

.test-title{
    color:#8793ae;
    text-align:center;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:10px;
}

.test-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.test-button{
    padding:12px 5px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    background:#111829;
    color:#dce3f5;
    cursor:pointer;
}

.test-button:hover{
    background:#1b2943;
}

.result{
    display:none;
    margin-top:25px;
}

.result-card{
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,215,106,.3);
    background:rgba(255,255,255,.06);
}

.result-name{
    font-size:36px;
    font-weight:900;
}

.result-text{
    margin-top:12px;
    line-height:1.85;
    color:#d7dced;
    white-space:pre-line;
}

.page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:80px 20px 50px;
}

.page-title{
    font-size:34px;
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:25px;
    text-align:center;
}

.back{
    position:fixed;
    top:18px;
    left:18px;
    z-index:1000;
    width:48px;
    height:48px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:50%;
    background:rgba(4,7,14,.9);
    color:#fff;
    font-size:24px;
    cursor:pointer;
}

.collection-grid{
    width:min(96%,900px);
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(165px,1fr));
    gap:12px;
}

.collection-item{
    min-height:92px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:17px;
    padding:12px;
    font-weight:900;
    cursor:pointer;
    color:#fff;
}

.collection-item.obtained{
    background:linear-gradient(145deg,#263b68,#111a31);
}

.collection-item.locked{
    background:#141923;
    color:#5d6575;
    cursor:not-allowed;
}

.mission{
    width:min(96%,720px);
    padding:20px;
    margin-bottom:14px;
    border-radius:18px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
}

.mission h3{
    margin-top:0;
}

.progress{
    height:10px;
    background:#252b3a;
    border-radius:10px;
    overflow:hidden;
    margin:12px 0;
}

.progress-bar{
    height:100%;
    background:linear-gradient(90deg,#6c8fff,#b4cdff);
}

.reward-button{
    margin-top:10px;
    padding:11px 18px;
    border:0;
    border-radius:10px;
    background:#304b83;
    color:#fff;
    cursor:pointer;
    font-weight:bold;
}

.reward-button:disabled{
    background:#343a47;
    color:#777f90;
    cursor:not-allowed;
}

.shop-box{
    width:min(94%,620px);
    min-height:320px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:25px;
    background:linear-gradient(145deg,#17223b,#0a0e19);
    border:1px solid rgba(255,255,255,.12);
}

.shop-coming{
    font-size:38px;
    font-weight:900;
    letter-spacing:5px;
    color:#dce5ff;
}

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(0,0,0,.80);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-overlay.active{
    display:flex;
}

.modal{
    width:min(94%,650px);
    max-height:90vh;
    overflow:auto;
    padding:28px;
    border-radius:25px;
    background:linear-gradient(145deg,#17213a,#080c16);
    border:1px solid rgba(255,255,255,.14);
    text-align:center;
}

.modal-title{
    font-size:30px;
    font-weight:900;
}

.modal-text{
    margin:20px 0;
    line-height:1.9;
    color:#d7dced;
    white-space:pre-line;
}

.action-button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:13px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.primary{
    background:#314e89;
    color:#fff;
}

.secondary{
    background:#242b3a;
    color:#fff;
}

/* =====================
   EFFECT
===================== */

#effect{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
}

.effect-rays{
    position:absolute;
    width:180vmax;
    height:180vmax;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:
        repeating-conic-gradient(
            transparent 0deg 7deg,
            rgba(255,220,100,.18) 8deg 11deg,
            transparent 12deg 20deg
        );
    animation:rotate 12s linear infinite;
}

.effect-light{
    position:absolute;
    left:50%;
    top:50%;
    width:15vmin;
    height:15vmin;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#fff;
    box-shadow:
        0 0 40px #fff,
        0 0 100px gold,
        0 0 220px gold;
    animation:pulse 3s infinite;
}

.effect-text{
    position:relative;
    z-index:5;
    color:#fff;
    font-size:clamp(42px,8vw,90px);
    font-weight:900;
    text-align:center;
    text-shadow:
        0 0 20px gold,
        0 0 50px #fff;
    opacity:0;
}

.effect-text.show{
    animation:appear 1.2s forwards;
}

.skip{
    position:absolute;
    top:20px;
    right:20px;
    z-index:20;
    padding:12px 18px;
    border:1px solid rgba(255,255,255,.4);
    border-radius:12px;
    background:rgba(0,0,0,.7);
    color:#fff;
    cursor:pointer;
}

#videoContainer{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
}

#youtubeFrame{
    width:min(90vw,900px);
    aspect-ratio:16/9;
    border:0;
}

@keyframes rotate{
    from{
        transform:translate(-50%,-50%) rotate(0deg);
    }
    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }
}

@keyframes pulse{
    0%,100%{
        transform:translate(-50%,-50%) scale(.4);
        opacity:.25;
    }
    50%{
        transform:translate(-50%,-50%) scale(2);
        opacity:1;
    }
}

@keyframes appear{
    from{
        transform:scale(.2);
        opacity:0;
        filter:blur(18px);
    }
    to{
        transform:scale(1);
        opacity:1;
        filter:blur(0);
    }
}

@media(max-width:600px){

    .home-buttons{
        grid-template-columns:1fr;
    }

    .test-buttons{
        grid-template-columns:1fr;
    }

    .currency-area{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:40px;
        letter-spacing:7px;
    }
}
</style>
</head>

    name:"超特大吉",
    text:"誰かからお賽銭がもらえるかも　ラッキーアイテム：我慢",
    type:"super"
}

/* 追加の「？？？」5種類は、
   具体的な名前・内容がまだ確定していないため
   勝手に変更しないよう、この版では未追加です。 */

];


/* =====================================================
   保存データ
===================================================== */

let data;

try{

    data=
        JSON.parse(
            localStorage.getItem("omikujiData") || "{}"
        );

}catch(error){

    data={};

}


if(typeof data.coins !== "number")
    data.coins=0;

if(typeof data.freeDraws !== "number")
    data.freeDraws=0;

if(typeof data.lastLogin !== "string")
    data.lastLogin="";

if(!Array.isArray(data.obtained))
    data.obtained=[];

if(typeof data.drawCount !== "number")
    data.drawCount=0;

if(!data.missions)
    data.missions={};

if(!data.claimed)
    data.claimed={};


let selectedResult=null;

let effectTimer=null;


/* =====================================================
   SAVE
===================================================== */

function save(){

    localStorage.setItem(
        "omikujiData",
        JSON.stringify(data)
    );

}


/* =====================================================
   DATE
===================================================== */

function today(){

    const d=new Date();

    return d.getFullYear()
        + "-"
        + String(d.getMonth()+1).padStart(2,"0")
        + "-"
        + String(d.getDate()).padStart(2,"0");

}


/* =====================================================
   LOGIN BONUS
===================================================== */

function loginBonus(){

    const date=today();

    if(data.lastLogin!==date){

        data.lastLogin=date;

        data.freeDraws++;

        save();

        alert(
            "🎁 ログインボーナス\n\n"+
            "無料おみくじを1回獲得しました！"
        );

    }

}


/* =====================================================
   PAGE
===================================================== */

function openPage(page){

    document
        .querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    const target=
        document.getElementById(
            page+"Screen"
        );

    if(!target)
        return;

    target.classList.add("active");

    if(page==="collection")
        renderCollection();

    if(page==="missions")
        renderMissions();

}


function goHome(){

    document
        .querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    document
        .getElementById("homeScreen")
        .classList.add("active");

}


/* =====================================================
   UI
===================================================== */

function updateCoins(){

    const element=
        document.getElementById("coinCount");

    if(element)
        element.textContent=data.coins;

}

function updateFreeDraws(){

    const element=
        document.getElementById("freeDrawCount");

    if(element)
        element.textContent=data.freeDraws;

}


/* =====================================================
   COIN REWARD
===================================================== */

function coinReward(result){

    if(result.name==="超特大吉")
        return 100;

    if(result.name==="大吉")
        return 50;

    if(result.type==="unique")
        return 10;

    if([
        "末小吉",
        "凶",
        "小凶",
        "半凶",
        "末凶",
        "大凶"
    ].includes(result.name))
        return 1;

    return 5;

}


/* =====================================================
   REAL DRAW
===================================================== */

function drawRealOmikuji(){

    let paidWithFree=false;

    if(data.freeDraws>0){

        data.freeDraws--;

        paidWithFree=true;

    }else{

        if(data.coins<=0){

            alert(
                "コインが足りません！\n\n"+
                "ログインボーナスやミッションで\n"+
                "コインを集めよう！"
            );

            return;

        }

        data.coins--;

    }


    const result=
        omikuji[
            Math.floor(
                Math.random()*omikuji.length
            )
        ];


    data.drawCount++;


    registerResult(result);


    data.coins+=
        coinReward(result);


    updateMissions(result);


    save();

    updateCoins();

    updateFreeDraws();


    playResult(result);


    void paidWithFree;

}


/* =====================================================
   REGISTER
===================================================== */

function registerResult(result){

    if(
        !data.obtained.includes(
            result.name
        )
    ){

        data.obtained.push(
            result.name
        );

    }

}


/* =====================================================
   MISSION UPDATE
===================================================== */

function updateMissions(result){

    data.missions.once=true;

    if(data.drawCount>=10)
        data.missions.ten=true;

    if(data.drawCount>=30)
        data.missions.thirty=true;

    if(result.type==="unique")
        data.missions.unique=true;

    if(result.name==="超特大吉")
        data.missions.super=true;

    if(
        data.obtained.length>=
        omikuji.length
    )
        data.missions.complete=true;

}


/* =====================================================
   TEST
===================================================== */

function testRandom(){

    const result=
        omikuji[
            Math.floor(
                Math.random()*omikuji.length
            )
        ];

    selectedResult=result;

    playResult(result);

}


function testGreat(){

    const result=
        omikuji.find(
            item=>item.name==="大吉"
        );

    if(!result)
        return;

    selectedResult=result;

    playResult(result);

}


function testSuper(){

    const result=
        omikuji.find(
            item=>item.name==="超特大吉"
        );

    if(!result)
        return;

    selectedResult=result;

    playResult(result);

}


/* =====================================================
   RESULT
===================================================== */

function showResult(result){

    const resultBox=
        document.getElementById("result");

    const resultName=
        document.getElementById("resultName");

    const resultText=
        document.getElementById("resultText");


    if(!resultBox)
        return;


    resultBox.style.display="block";


    resultName.textContent=
        result.name;


    resultText.textContent=
        result.text;

}


/* =====================================================
   PLAY RESULT
===================================================== */

function playResult(result){

    if(!result)
        return;


    if(
        result.type==="great" ||
        result.type==="super"
    ){

        playLuxuryEffect(result);

        return;

    }


    if(
        result.video &&
        result.video.platform==="youtube"
    ){

        playYouTubeEffect(result);

        return;

    }


    showSimpleEffect(result);

}


/* =====================================================
   SIMPLE EFFECT
===================================================== */

function showSimpleEffect(result){

    const effect=
        document.getElementById("effect");

    const text=
        document.getElementById("effectText");

    const graphics=
        document.getElementById("effectGraphics");

    const video=
        document.getElementById("videoContainer");


    video.style.display="none";

    graphics.style.display="block";

    effect.style.display="flex";

    effect.style.background=
        "#080b14";


    text.classList.remove("show");

    text.textContent=
        result.name;


    void text.offsetWidth;

    text.classList.add("show");


    effectTimer=
        setTimeout(
            function(){

                finishEffect();

                showResult(result);

            },
            2200
        );

}


/* =====================================================
   LUXURY EFFECT
===================================================== */

function playLuxuryEffect(result){

    const effect=
        document.getElementById("effect");

    const graphics=
        document.getElementById("effectGraphics");

    const video=
        document.getElementById("videoContainer");

    const text=
        document.getElementById("effectText");


    if(effectTimer){

        clearTimeout(effectTimer);

        effectTimer=null;

    }


    video.style.display="none";

    graphics.style.display="block";

    effect.style.display="flex";

    effect.style.background="#000";


    text.textContent="";

    text.classList.remove("show");


    setTimeout(function(){

        effect.style.background=
            "radial-gradient("+
            "circle at center,"+
            "#ffffff 0%,"+
            "#e5b936 15%,"+
            "#51410b 35%,"+
            "#050505 75%"+
            ")";

    },1000);


    setTimeout(function(){

        text.textContent=
            result.name;

        void text.offsetWidth;

        text.classList.add("show");

    },2500);


    effectTimer=
        setTimeout(
            function(){

                finishEffect();

                showResult(result);

            },
            5500
        );

}


/* =====================================================
   YOUTUBE
===================================================== */

function playYouTubeEffect(result){

    const effect=
        document.getElementById("effect");

    const video=
        document.getElementById("videoContainer");

    const graphics=
        document.getElementById("effectGraphics");

    const frame=
        document.getElementById("youtubeFrame");

    const text=
        document.getElementById("effectText");


    effect.style.display="flex";

    effect.style.background="#000";

    graphics.style.display="none";

    text.classList.remove("show");

    text.textContent="";


    let url=
        "https://www.youtube.com/embed/"
        + result.video.id
        + "?autoplay=1&rel=0&modestbranding=1";


    if(
        typeof result.video.start==="number"
    ){

        url+="&start="+result.video.start;

    }


    frame.src=url;

    video.style.display="flex";


    let duration=10000;


    if(
        typeof result.video.start==="number" &&
        typeof result.video.end==="number"
    ){

        duration=
            (
                result.video.end -
                result.video.start
            )*1000 + 1500;

    }


    effectTimer=
        setTimeout(
            function(){

                finishEffect();

                showResult(result);

            },
            duration
        );

}


/* =====================================================
   SKIP
===================================================== */

function skipEffect(){

    if(effectTimer){

        clearTimeout(effectTimer);

        effectTimer=null;

    }


    const result=
        selectedResult;


    finishEffect();


    if(result){

        showResult(result);

        selectedResult=null;

    }

}


/* =====================================================
   FINISH
===================================================== */

function finishEffect(){

    const effect=
        document.getElementById("effect");

    const frame=
        document.getElementById("youtubeFrame");

    const video=
        document.getElementById("videoContainer");

    const text=
        document.getElementById("effectText");


    effect.style.display="none";

    video.style.display="none";

    frame.src="";

    text.textContent="";

    text.classList.remove("show");

}


/* =====================================================
   COLLECTION
===================================================== */

function renderCollection(){

    const grid=
        document.getElementById(
            "collectionGrid"
        );


    grid.innerHTML="";


    omikuji.forEach(function(result){

        const obtained=
            data.obtained.includes(
                result.name
            );


        const button=
            document.createElement("button");


        button.className=
            "collection-item "
            +
            (
                obtained
                ? "obtained"
                : "locked"
            );


        button.textContent=
            obtained
            ? result.name
            : "🔒 未入手";


        if(obtained){

            button.onclick=
                function(){

                    openDetail(result);

                };

        }


        grid.appendChild(button);

    });

}


/* =====================================================
   DETAIL
===================================================== */

function openDetail(result){

    selectedResult=result;

    document
        .getElementById("detailTitle")
        .textContent=
            result.name;

    document
        .getElementById("detailText")
        .textContent=
            result.text;

    document
        .getElementById("detailOverlay")
        .classList.add("active");

}


function closeDetail(){

    document
        .getElementById("detailOverlay")
        .classList.remove("active");

    selectedResult=null;

}


function watchCollectionEffect(){

    if(!selectedResult)
        return;


    const result=
        selectedResult;


    closeDetail();


    playResult(result);

}


/* =====================================================
   EFFECT TEST
===================================================== */

function openEffectTest(){

    const overlay=
        document.getElementById(
            "effectTestOverlay"
        );

    const list=
        document.getElementById(
            "effectTestList"
        );


    list.innerHTML="";


    omikuji.forEach(function(result){

        const button=
            document.createElement("button");


        button.className=
            "collection-item obtained";


        button.textContent=
            result.name;


        button.onclick=
            function(){

                closeEffectTest();

                /*
                 * テストなので
                 * コイン・無料分・回数・
                 * ミッション・図鑑は変更しません。
                 */

                selectedResult=result;

                playResult(result);

            };


        list.appendChild(button);

    });


    overlay.classList.add("active");

}


function closeEffectTest(){

    document
        .getElementById(
            "effectTestOverlay"
        )
        .classList.remove("active");

}


/* =====================================================
   MISSIONS
===================================================== */

function renderMissions(){

    const list=
        document.getElementById(
            "missionList"
        );


    list.innerHTML="";


    createMission(
        list,
        "once",
        "おみくじを1回引こう",
        data.drawCount>=1,
        "100コイン",
        100
    );


    createMission(
        list,
        "ten",
        "おみくじを10回引こう",
        data.drawCount>=10,
        "1000コイン",
        1000
    );


    createMission(
        list,
        "thirty",
        "おみくじを30回引こう",
        data.drawCount>=30,
        "2000コイン",
        2000
    );


    createMission(
        list,
        "unique",
        "ユニークくじを1枚引こう",
        data.missions.unique===true,
        "2000カウンシー",
        0,
        "unique"
    );


    createMission(
        list,
        "super",
        "超特大吉を1枚引こう",
        data.missions.super===true,
        "5000カウンシー",
        0,
        "super"
    );


    createMission(
        list,
        "complete",
        "全種類をコンプリートしよう",
        data.obtained.length>=omikuji.length,
        "3000コイン ＋ おみくじ別班",
        3000,
        "complete"
    );

}


function createMission(
    parent,
    id,
    title,
    complete,
    reward,
    coins,
    special=""
){

    let progress=0;

    let max=1;


    if(id==="once"){

        progress=
            Math.min(
                data.drawCount,
                1
            );

        max=1;

    }


    if(id==="ten"){

        progress=
            Math.min(
                data.drawCount,
                10
            );

        max=10;

    }


    if(id==="thirty"){

        progress=
            Math.min(
                data.drawCount,
                30
            );

        max=30;

    }


    if(id==="complete"){

        progress=
            Math.min(
                data.obtained.length,
                omikuji.length
            );

        max=omikuji.length;

    }


    const percentage=
        Math.round(
            progress/max*100
        );


    const claimed=
        data.claimed[id]===true;


    const div=
        document.createElement("div");


    div.className="mission";


    div.innerHTML=
        "<h3>"+title+"</h3>"
        +
        '<div class="progress">'
        +
        '<div class="progress-bar" style="width:'
        + percentage
        + '%;"></div>'
        +
        '</div>'
        +
        '<div>進行度：'
        + progress
        + '/'
        + max
        + '</div>'
        +
        '<p>報酬：'
        + reward
        + '</p>'
        +
        '<button class="reward-button" '
        + (
            (!complete || claimed)
            ? "disabled"
            : ""
        )
        + ' onclick="claimMission(\''
        + id
        + '\',\''
        + special
        + '\','
        + coins
        + ')">'
        +
        (
            claimed
            ? "受け取り済み"
            : complete
            ? "受け取る"
            : "未達成"
        )
        +
        '</button>';


    parent.appendChild(div);

}


function claimMission(
    id,
    special,
    coins
){

    if(data.claimed[id])
        return;


    if(coins>0){

        data.coins+=coins;

    }


    if(special==="unique"){

        alert(
            "ミッション達成！\n"
            + "2000カウンシーを獲得しました！"
        );

    }


    if(special==="super"){

        alert(
            "ミッション達成！\n"
            + "5000カウンシーを獲得しました！"
        );

    }


    if(special==="complete"){

        alert(
            "ミッション達成！\n\n"
            + "称号「おみくじ別班」を獲得しました！"
        );

    }


    data.claimed[id]=true;

    save();

    updateCoins();

    renderMissions();

}


/* =====================================================
   INITIALIZE
===================================================== */

loginBonus();

updateCoins();

updateFreeDraws();

renderCollection();

renderMissions();

</script>
