<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>おみくじ</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

    background:
        linear-gradient(135deg, #fff4d8, #ffe1e8);

    min-height: 100vh;
    color: #333;
}


/* =========================
   共通
========================= */

.screen {
    min-height: 100vh;
    padding: 25px;
}

.hidden {
    display: none !important;
}


/* =========================
   メイン画面
========================= */

#homeScreen {
    text-align: center;
}

.title {
    font-size: 42px;
    font-weight: bold;
    margin-top: 35px;
}

.subtitle {
    color: #777;
    margin-bottom: 35px;
}


.coin {
    display: inline-block;

    background: white;

    padding: 10px 20px;

    border-radius: 20px;

    font-weight: bold;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.08);

    margin-bottom: 25px;
}


/* =========================
   ボタン
========================= */

.mainButton {

    display: block;

    width: min(420px, 90%);

    margin: 15px auto;

    padding: 18px;

    border: none;

    border-radius: 18px;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

    background: white;

    box-shadow:
        0 6px 18px rgba(0,0,0,0.1);

    transition: 0.2s;
}


.mainButton:hover {

    transform: translateY(-3px);

    box-shadow:
        0 9px 22px rgba(0,0,0,0.15);
}


.drawButton {

    background: #d93636;

    color: white;

    font-size: 23px;

    padding: 20px;
}


/* =========================
   戻るボタン
========================= */

.backButton {

    position: fixed;

    top: 18px;

    left: 18px;

    border: none;

    background: white;

    border-radius: 50%;

    width: 50px;

    height: 50px;

    font-size: 25px;

    cursor: pointer;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.12);

    z-index: 20;
}


/* =========================
   結果
========================= */

#resultArea {

    margin: 30px auto;

    max-width: 700px;

    background: white;

    border-radius: 25px;

    padding: 30px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.12);

    animation: resultAppear 0.5s;
}


.resultName {

    font-size: 45px;

    font-weight: bold;

    margin-bottom: 20px;
}


.resultText {

    font-size: 19px;

    line-height: 1.8;

    white-space: pre-wrap;
}


.resultCoins {

    margin-top: 20px;

    padding: 14px;

    border-radius: 15px;

    background: #fff2a8;

    font-weight: bold;
}


@keyframes resultAppear {

    from {

        opacity: 0;

        transform: scale(0.75);
    }

    to {

        opacity: 1;

        transform: scale(1);
    }
}


/* =========================
   ガチャ演出
========================= */

#gachaEffect {

    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            circle,
            #fff,
            #ffd86b,
            #d33
        );

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 100;

    animation: gachaFlash 1.2s;
}


.gachaText {

    color: white;

    font-size: 55px;

    font-weight: bold;

    text-shadow:
        0 5px 15px rgba(0,0,0,0.4);

    animation: gachaZoom 1.2s;
}


@keyframes gachaFlash {

    0% {
        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}


@keyframes gachaZoom {

    0% {
        transform: scale(0.2) rotate(-10deg);
    }

    70% {
        transform: scale(1.2) rotate(5deg);
    }

    100% {
        transform: scale(1);
    }
}


/* =========================
   ページ
========================= */

.page {

    max-width: 1000px;

    margin: auto;

    padding-top: 40px;
}


.pageTitle {

    text-align: center;

    font-size: 35px;

    margin-bottom: 30px;
}


/* =========================
   図鑑
========================= */

.bookGrid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(190px, 1fr)
        );

    gap: 15px;
}


.bookCard {

    background: white;

    border-radius: 18px;

    padding: 20px;

    min-height: 130px;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.08);
}


.bookCard.locked {

    color: #aaa;

    text-align: center;
}


.bookCard.unlocked {

    background: #fff8ca;
}


.bookName {

    font-size: 21px;

    font-weight: bold;

    margin-bottom: 10px;
}


.bookText {

    line-height: 1.6;

    font-size: 14px;
}


/* =========================
   ミッション
========================= */

.missionList {

    display: flex;

    flex-direction: column;

    gap: 15px;
}


.missionCard {

    background: white;

    border-radius: 18px;

    padding: 20px;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.08);

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;
}


.missionCard.completed {

    background: #eaffea;
}


.missionTitle {

    font-size: 18px;

    font-weight: bold;
}


.missionReward {

    color: #a86b00;

    margin-top: 5px;
}


.receiveButton {

    border: none;

    border-radius: 12px;

    padding: 12px 18px;

    background: #d93636;

    color: white;

    font-weight: bold;

    cursor: pointer;

    white-space: nowrap;
}


.receiveButton:disabled {

    background: #aaa;

    cursor: default;
}


.statusText {

    color: #777;

    white-space: nowrap;
}


/* =========================
   ショップ
========================= */

.comingSoon {

    min-height: 60vh;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    font-size: 35px;

    font-weight: bold;
}


/* =========================
   レスポンシブ
========================= */

@media(max-width:600px) {

    .title {
        font-size: 32px;
    }

    .resultName {
        font-size: 34px;
    }

    .gachaText {
        font-size: 35px;
    }

    .missionCard {
        flex-direction: column;
        align-items: flex-start;
    }

}

</style>
</head>

/* ==================================================
   データ
================================================== */

let data =
    JSON.parse(
        localStorage.getItem("omikujiData")
    )
    ||
    {

        coins: 0,

        drawCount: 0,

        collected: [],

        lastDrawDate: "",

        missions: {

            first: {
                progress: 0,
                claimed: false
            },

            ten: {
                progress: 0,
                claimed: false
            },

            thirty: {
                progress: 0,
                claimed: false
            },

            super: {
                progress: 0,
                claimed: false
            },

            unique: {
                progress: 0,
                claimed: false
            },

            complete: {
                progress: 0,
                claimed: false
            }

        }

    };


/* ==================================================
   保存
================================================== */

function saveData() {

    localStorage.setItem(
        "omikujiData",
        JSON.stringify(data)
    );

}


/* ==================================================
   日付
================================================== */

function today() {

    const d = new Date();

    return d.getFullYear()
        + "-"
        + String(d.getMonth() + 1).padStart(2, "0")
        + "-"
        + String(d.getDate()).padStart(2, "0");

}


/* ==================================================
   今日引いたか
================================================== */

function alreadyDrawn() {

    return data.lastDrawDate === today();

}


/* ==================================================
   ページ切り替え
================================================== */

function showPage(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.add("hidden");

        });


    document
        .getElementById(id)
        .classList.remove("hidden");


    if (id === "bookScreen") {

        updateBook();

    }


    if (id === "missionScreen") {

        updateMissions();

    }

}


/* ==================================================
   ガチャ演出
================================================== */

function gachaAnimation(callback) {

    const effect =
        document.getElementById("gachaEffect");


    effect.style.display = "flex";


    setTimeout(() => {

        effect.style.display = "none";

        callback();

    }, 1200);

}


/* ==================================================
   おみくじ
================================================== */

function drawOmikuji() {

    if (alreadyDrawn()) {

        alert(
            "今日はもうおみくじを引いています！\nまた明日引いてください🎴"
        );

        return;

    }


    const result =
        omikuji[
            Math.floor(
                Math.random() * omikuji.length
            )
        ];


    data.lastDrawDate = today();

    data.drawCount++;

    data.coins += result.coins;


    if (
        !data.collected.includes(
            result.name
        )
    ) {

        data.collected.push(
            result.name
        );

    }


    /* ミッション進行 */

    data.missions.first.progress =
        Math.min(
            data.drawCount,
            1
        );


    data.missions.ten.progress =
        Math.min(
            data.drawCount,
            10
        );


    data.missions.thirty.progress =
        Math.min(
            data.drawCount,
            30
        );


    if (
        result.name === "超特大吉"
    ) {

        data.missions.super.progress = 1;

    }


    if (
        result.type === "unique"
    ) {

        data.missions.unique.progress = 1;

    }


    data.missions.complete.progress =
        data.collected.length;


    saveData();


    gachaAnimation(
        () => {

            showResult(result);

            updateAll();

        }
    );

}


/* ==================================================
   結果表示
================================================== */

function showResult(result) {

    const area =
        document.getElementById(
            "resultArea"
        );


    area.classList.remove("hidden");


    document.getElementById(
        "resultName"
    ).textContent =
        result.name;


    document.getElementById(
        "resultText"
    ).textContent =
        result.text;


    document.getElementById(
        "resultCoin"
    ).textContent =
        result.coins;


    const name =
        document.getElementById(
            "resultName"
        );


    if (result.type === "super") {

        name.style.color = "#d59a00";

    }

    else if (
        result.type === "unique"
    ) {

        name.style.color = "#7541c9";

    }

    else if (
        result.name === "大吉"
    ) {

        name.style.color = "#d93636";

    }

    else {

        name.style.color = "#333";

    }

}


/* ==================================================
   コイン
================================================== */

function updateCoin() {

    document.getElementById(
        "coinDisplay"
    ).textContent =
        data.coins.toLocaleString();

}


/* ==================================================
   1日1回表示
================================================== */

function updateDaily() {

    const button =
        document.getElementById(
            "drawButton"
        );


    const message =
        document.getElementById(
            "dailyMessage"
        );


    if (alreadyDrawn()) {

        button.disabled = true;

        button.style.background =
            "#999";


        button.textContent =
            "🌙 また明日引いてください";


        message.textContent =
            "今日はもう引いています。";

    }

    else {

        button.disabled = false;

        button.style.background =
            "#d93636";


        button.textContent =
            "🎴 おみくじを引く";


        message.textContent =
            "今日はまだ引いていません！";

    }

}


/* ==================================================
   図鑑
================================================== */

function updateBook() {

    document.getElementById(
        "bookProgress"
    ).textContent =
        data.collected.length;


    document.getElementById(
        "bookTotal"
    ).textContent =
        omikuji.length;


    const grid =
        document.getElementById(
            "bookGrid"
        );


    grid.innerHTML = "";


    omikuji.forEach(item => {

        const unlocked =
            data.collected.includes(
                item.name
            );


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "bookCard "
            +
            (
                unlocked
                    ? "unlocked"
                    : "locked"
            );


        if (unlocked) {

            card.innerHTML = `

                <div class="bookName">
                    🎴 ${item.name}
                </div>

                <div class="bookText">
                    ${item.text}
                </div>

            `;

        }

        else {

            card.innerHTML = `

                <div class="bookName">
                    ❓？？？
                </div>

                <div>
                    まだ引いていません
                </div>

            `;

        }


        grid.appendChild(card);

    });

}

        },

        {
            id: "unique",

            title:
                "ユニークくじを1枚引く",

            reward:
                "2,000カウンシー",

            max: 1
        },

        {
            id: "complete",

            title:
                "おみくじを全種類コンプリートする",

            reward:
                "3,000コイン＋称号「おみくじ別班」",

            max:
                omikuji.length
        }

    ];


    list.innerHTML = "";


    missions.forEach(mission => {

        const current =
            data.missions[
                mission.id
            ].progress;


        const claimed =
            data.missions[
                mission.id
            ].claimed;


        const completed =
            current >= mission.max;


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "missionCard "
            +
            (
                completed
                    ? "completed"
                    : ""
            );


        const left =
            document.createElement(
                "div"
            );


        left.innerHTML = `

            <div class="missionTitle">

                ${
                    completed
                        ? "✅"
                        : "⬜"
                }

                ${mission.title}

            </div>

            <div>

                進行：
                ${Math.min(
                    current,
                    mission.max
                )}
                /
                ${mission.max}

            </div>

            <div class="missionReward">

                🎁 報酬：
                ${mission.reward}

            </div>

        `;


        card.appendChild(left);


        if (claimed) {

            const status =
                document.createElement(
                    "div"
                );


            status.className =
                "statusText";


            status.textContent =
                "受け取り済み";


            card.appendChild(
                status
            );

        }

        else if (completed) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "receiveButton";


            button.textContent =
                "受け取る";


            button.onclick =
                () => {

                    claimMission(
                        mission.id
                    );

                };


            card.appendChild(
                button
            );

        }

        else {

            const status =
                document.createElement(
                    "div"
                );


            status.className =
                "statusText";


            status.textContent =
                "未達成";


            card.appendChild(
                status
            );

        }


        list.appendChild(card);

    });

}


/* ==================================================
   ミッション報酬を受け取る
================================================== */

function claimMission(id) {

    const mission =
        data.missions[id];


    if (mission.claimed) {

        return;

    }


    if (id === "first") {

        data.coins += 100;

    }


    else if (id === "ten") {

        data.coins += 1000;

    }


    else if (id === "thirty") {

        data.coins += 2000;

    }


    else if (id === "super") {

        /*
          カウンシーは
          サイト内では保存だけします。
          表示欄は今回削除しています。
        */

        alert(
            "超特大吉ミッション達成！\n5,000カウンシー獲得！"
        );

    }


    else if (id === "unique") {

        alert(
            "ユニークくじミッション達成！\n2,000カウンシー獲得！"
        );

    }


    else if (id === "complete") {

        data.coins += 3000;

        alert(
            "全種類コンプリート！\n"
            +
            "3,000コイン獲得！\n\n"
            +
            "🏅 称号「おみくじ別班」を獲得しました！"
        );

    }


    mission.claimed = true;


    saveData();

    updateAll();

    updateMissions();

}


/* ==================================================
   全体更新
================================================== */

function updateAll() {

    updateCoin();

    updateDaily();

    updateBook();

    updateMissions();

}


/* ==================================================
   初期化
================================================== */

updateAll();

</script>
